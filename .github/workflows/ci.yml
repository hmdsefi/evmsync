name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  root:
    name: root (${{ matrix.os }}, go ${{ matrix.go }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
        go: ['1.26.x', '1.27.x']
    runs-on: ${{ matrix.os }}
    env:
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: gofmt
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"
      - name: go mod tidy
        run: go mod tidy -diff
      - name: vet
        run: go vet ./...
      - name: build without cgo
        run: CGO_ENABLED=0 go build ./...
      - name: test without cgo
        run: CGO_ENABLED=0 go test -count=1 ./...
      - name: test with the race detector
        run: go test -race -count=1 ./...

  fuzz:
    runs-on: ubuntu-latest
    env:
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
      - name: fuzz smoke
        run: |
          set -e
          for t in ; do
            pkg=${t%%:*}
            target=${t#*:}
            go test -list "^${target}\$" "./$pkg" | grep -qx "$target" || { echo "fuzz target $target not found in ./$pkg"; exit 1; }
            go test -run '^$' -fuzz "^${target}\$" -fuzztime 10s "./$pkg"
          done

  lint:
    runs-on: ubuntu-latest
    env:
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
